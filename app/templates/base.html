<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ t.app_title }}</title>
  <style>
    :root { --bg:#f6f8fa; --card:#fff; --text:#1f2328; --muted:#59636e; --line:#d1d9e0; --accent:#0969da; --bad:#cf222e; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --card:#161b22; --text:#e6edf3; --muted:#9198a1; --line:#30363d; --accent:#4493f8; --bad:#f85149; }
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); }
    header { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); background:var(--card); }
    header a { color:var(--text); text-decoration:none; font-weight:600; }
    nav a { margin-left:8px; color:var(--muted); font-weight:400; }
    nav a.active { color:var(--accent); font-weight:600; }
    main { max-width:960px; margin:0 auto; padding:16px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:16px; }
    label { display:block; margin:8px 0 4px; color:var(--muted); font-size:14px; }
    input, textarea, select { width:100%; padding:8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--text); font:inherit; }
    button { margin-top:12px; padding:8px 16px; border:0; border-radius:6px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:8px; border-bottom:1px solid var(--line); font-size:14px; }
    th { color:var(--muted); font-weight:500; }
    .badge { display:inline-block; padding:2px 8px; border-radius:10px; border:1px solid var(--line); font-size:12px; }
    .breached { color:var(--bad); font-weight:600; }
    .scroll { overflow-x:auto; }
  </style>
</head>
<body>
  <header>
    <a href="/?lang={{ lang }}">{{ t.app_title }}</a>
    <nav>
      {% for code in languages %}
        <a href="?lang={{ code }}" class="{{ 'active' if code == lang else '' }}">{{ code|upper }}</a>
      {% endfor %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
