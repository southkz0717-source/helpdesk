<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ t.app_title }}{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a78d6'/%3E%3Cpath d='M9 16a7 7 0 0 1 14 0v4a2 2 0 0 1-2 2h-1v-6h3M9 16v4a2 2 0 0 0 2 2h1v-6H9' fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <script>
    // apply the saved theme before the first paint (no flash); storage may be blocked
    try { var th = localStorage.getItem("helpdesk-theme"); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
  </script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f5f7;
      --surface: #ffffff;
      --surface-2: #f8f9fb;
      --text: #0b0b0b;
      --text-2: #52514e;
      --muted: #6b6a66;
      --line: #e3e4e8;
      --accent: #1f66c2;
      --accent-hover: #184f95;
      --accent-soft: #e8f1fc;
      --focus: #2a78d6;
      --series-1: #2a78d6;
      --series-2: #eb6834;
      --critical: #c22f2f;
      --critical-soft: #fdecec;
      --serious: #b34a12;
      --serious-soft: #fdf0e8;
      --info: #1f5fa8;
      --info-soft: #e8f1fc;
      --neutral: #4f4e4a;
      --neutral-soft: #efefec;
      --good: #12701d;
      --good-soft: #e7f5e8;
      --warning: #8a5a00;
      --warning-soft: #fdf3dd;
      --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
      --radius: 12px;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #121211; --surface: #1a1a19; --surface-2: #222220; --text: #f0efec; --text-2: #c3c2b7;
        --muted: #a3a29b; --line: #34342f; --accent: #5598e7; --accent-hover: #86b6ef; --accent-soft: #1c2c42;
        --focus: #86b6ef; --series-1: #3987e5; --series-2: #d95926;
        --critical: #f08484; --critical-soft: #3a1f1f; --serious: #f0a070; --serious-soft: #3a2619;
        --info: #86b6ef; --info-soft: #1c2c42; --neutral: #c3c2b7; --neutral-soft: #2c2c29;
        --good: #6fd27a; --good-soft: #1b3320; --warning: #f2c45a; --warning-soft: #352a12;
        --shadow: 0 1px 2px rgba(0, 0, 0, .4);
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #121211; --surface: #1a1a19; --surface-2: #222220; --text: #f0efec; --text-2: #c3c2b7;
      --muted: #a3a29b; --line: #34342f; --accent: #5598e7; --accent-hover: #86b6ef; --accent-soft: #1c2c42;
      --focus: #86b6ef; --series-1: #3987e5; --series-2: #d95926;
      --critical: #f08484; --critical-soft: #3a1f1f; --serious: #f0a070; --serious-soft: #3a2619;
      --info: #86b6ef; --info-soft: #1c2c42; --neutral: #c3c2b7; --neutral-soft: #2c2c29;
      --good: #6fd27a; --good-soft: #1b3320; --warning: #f2c45a; --warning-soft: #352a12;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 15px; line-height: 1.5; background: var(--bg); color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent); text-underline-offset: 2px; }
    a:hover { color: var(--accent-hover); }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
    h1, h2, h3 { line-height: 1.25; margin: 0; }
    h1 { font-size: 26px; font-weight: 700; letter-spacing: -.01em; }
    h2 { font-size: 18px; font-weight: 650; }
    h3 { font-size: 15px; font-weight: 600; }

    /* ---------- header ---------- */
    .topbar { position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--line); }
    .topbar-inner { max-width: 1160px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none; font-weight: 700; font-size: 16px; }
    .brand:hover { color: var(--text); }
    .brand-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--series-1); display: grid; place-items: center; flex: none; }
    .nav { display: flex; gap: 4px; flex: 1; }
    .nav a { padding: 6px 12px; border-radius: 8px; color: var(--text-2); text-decoration: none; font-weight: 500; }
    .nav a:hover { background: var(--surface-2); color: var(--text); }
    .nav a.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    .tools { display: flex; align-items: center; gap: 6px; }
    .langs { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .langs a { padding: 4px 9px; font-size: 13px; color: var(--text-2); text-decoration: none; font-weight: 600; }
    .langs a + a { border-left: 1px solid var(--line); }
    .langs a.active { background: var(--accent); color: #fff; }
    .icon-btn { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--text-2); cursor: pointer; padding: 0; margin: 0; }
    .icon-btn:hover { background: var(--surface-2); color: var(--text); }
    .icon-btn .moon { display: none; }
    :root[data-theme="dark"] .icon-btn .sun { display: none; }
    :root[data-theme="dark"] .icon-btn .moon { display: block; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .icon-btn .sun { display: none; }
      :root:not([data-theme="light"]) .icon-btn .moon { display: block; }
    }

    @media (max-width: 640px) {
      .topbar { position: static; }
      .topbar-inner { gap: 8px 12px; }
      .tools { margin-left: auto; }
      .nav { order: 3; flex-basis: 100%; }
      .nav a { flex: 1; text-align: center; }
      h1 { font-size: 22px; }
      main { padding-top: 16px; }
    }

    /* ---------- layout ---------- */
    main { max-width: 1160px; margin: 0 auto; padding: 24px 16px 48px; }
    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    .page-head p { margin: 4px 0 0; color: var(--text-2); }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; margin-bottom: 20px; }
    .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
    .card-head p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
    .split { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 20px; align-items: start; }
    .split > .card { margin-bottom: 0; }
    .sticky { position: sticky; top: 76px; }
    /* minmax(0, 1fr), not 1fr: a wide table must scroll inside its card, not widen the page */
    @media (max-width: 860px) { .split { grid-template-columns: minmax(0, 1fr); } .sticky { position: static; } }

    /* ---------- forms ---------- */
    label { display: block; margin: 12px 0 6px; color: var(--text-2); font-size: 13px; font-weight: 600; }
    input, textarea, select {
      width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px;
      background: var(--surface-2); color: var(--text); font: inherit;
    }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px var(--accent-soft); background: var(--surface); }
    textarea { resize: vertical; }
    button, .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px; margin-top: 16px;
      padding: 9px 18px; border: 0; border-radius: 8px; background: var(--accent); color: #fff;
      font: inherit; font-weight: 600; cursor: pointer; text-decoration: none;
    }
    button:hover, .btn:hover { background: var(--accent-hover); color: #fff; }
    :root[data-theme="dark"] button:not(.icon-btn), :root[data-theme="dark"] .btn { color: #0b0b0b; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) button:not(.icon-btn), :root:not([data-theme="light"]) .btn { color: #0b0b0b; } }
    .btn-block { width: 100%; }

    /* ---------- tables ---------- */
    .scroll { overflow-x: auto; margin: 0 -20px; padding: 0 20px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 10px; border-bottom: 1px solid var(--line); font-size: 14px; vertical-align: middle; }
    thead th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
    tbody tr:hover { background: var(--surface-2); }
    tbody tr:last-child td { border-bottom: 0; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .id { color: var(--muted); font-variant-numeric: tabular-nums; }
    .ticket-link { color: var(--text); font-weight: 500; text-decoration: none; }
    .ticket-link:hover { color: var(--accent); text-decoration: underline; }

    /* ---------- badges ---------- */
    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; line-height: 1.6; }
    .badge.P1 { background: var(--critical-soft); color: var(--critical); }
    .badge.P2 { background: var(--serious-soft); color: var(--serious); }
    .badge.P3 { background: var(--info-soft); color: var(--info); }
    .badge.P4 { background: var(--neutral-soft); color: var(--neutral); }
    .status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; white-space: nowrap; }
    .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
    .status.new { color: var(--info); }
    .status.in_progress { color: var(--warning); }
    .status.resolved { color: var(--good); }
    .status.closed { color: var(--neutral); }
    .breached { display: inline-flex; align-items: center; gap: 4px; color: var(--critical); font-weight: 600; font-size: 13px; }

    /* ---------- misc ---------- */
    .search { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
    .search input { flex: 1; min-width: 200px; }
    .search button { margin-top: 0; }
    .muted { color: var(--muted); font-size: 13px; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .empty { padding: 32px 8px; text-align: center; color: var(--muted); }
    footer { max-width: 1160px; margin: 0 auto; padding: 0 16px 32px; color: var(--muted); font-size: 12px; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/?lang={{ lang }}">
        <span class="brand-mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13a8 8 0 0 1 16 0v4a2 2 0 0 1-2 2h-1v-7h3M4 13v4a2 2 0 0 0 2 2h1v-7H4"/></svg>
        </span>
        {{ t.app_title }}
      </a>
      <nav class="nav">
        <a href="/?lang={{ lang }}" class="{{ 'active' if page == 'tickets' else '' }}">{{ t.nav_tickets }}</a>
        <a href="/dashboard?lang={{ lang }}" class="{{ 'active' if page == 'dashboard' else '' }}">{{ t.nav_dashboard }}</a>
      </nav>
      <div class="tools">
        <div class="langs">
          {% for code in languages %}
            <a href="?lang={{ code }}" class="{{ 'active' if code == lang else '' }}" hreflang="{{ code }}">{{ code|upper }}</a>
          {% endfor %}
        </div>
        <button type="button" class="icon-btn" id="theme-toggle" aria-label="{{ t.theme }}" title="{{ t.theme }}">
          <svg class="sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
    document.getElementById("theme-toggle").addEventListener("click", function () {
      var root = document.documentElement;
      var dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      root.dataset.theme = dark ? "light" : "dark";
      try { localStorage.setItem("helpdesk-theme", root.dataset.theme); } catch (e) {}
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
